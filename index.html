<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Drug–Receptor Binding Challenge (PH110)</title><meta name="description" content="Interactive drug–receptor binding quiz with a clue system for UiTM Diploma in Pharmacy (PH110). Developed by Faiz Zulkifli.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#050d1f;--cy:#22d3ee;--tl:#2dd4bf;--tx:#e6f3ff;--mu:#8fb0cc;--ok:#34d399;--no:#fb7185;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(ellipse at 20% 0,#0b2a52,var(--bg) 60%) var(--bg)}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none}

.glass{background:rgba(16,38,70,.55);border:1px solid rgba(34,211,238,.22);backdrop-filter:blur(12px);border-radius:20px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.35)}

.prog{height:6px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden;margin-bottom:14px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--tl),var(--cy));transition:width .5s}
.prompt{text-align:center;color:var(--mu);margin:6px 0 14px}
.zone{position:relative}

.lbl{font-size:11px;letter-spacing:.3em;color:var(--mu)}

#lig.bound{animation:pulse .6s 2}
@keyframes pulse{50%{box-shadow:0 0 60px #fff}}
.recs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;transition:filter .35s}
.zone.blur .recs{filter:blur(9px)}
@media(max-width:720px){.recs{grid-template-columns:repeat(2,1fr)}}
.rec{text-align:center;padding:10px;border-radius:18px;background:rgba(10,25,50,.6);border:1px solid rgba(34,211,238,.18);transition:.2s;min-height:190px}
.rec.hov{border-color:var(--cy);box-shadow:0 0 22px rgba(34,211,238,.55);transform:scale(1.03)}
.rec.shake{animation:shake .45s;border-color:var(--no)}
.rec.win{border-color:var(--ok);box-shadow:0 0 28px rgba(52,211,153,.7)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.rec svg{width:100%;max-height:150px}
.rn{font-weight:700;letter-spacing:.12em;font-size:13px;color:var(--cy)}
.rec.win .rn{color:var(--ok);letter-spacing:.04em;text-transform:uppercase}
.ana{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:60;font-weight:700;letter-spacing:.12em;color:var(--cy);text-shadow:0 0 14px #000;text-align:center}
.zone.blur .ana{display:flex}
#msg{text-align:center;min-height:30px;margin:14px 0;font-weight:700}
.ok{color:var(--ok)}.no{color:var(--no)}
.big{font-size:clamp(20px,4vw,30px);letter-spacing:.06em;text-transform:uppercase;animation:pop .5s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.hint{font-weight:400;color:var(--mu);margin-top:4px}
.btn{background:linear-gradient(135deg,#0891b2,#14b8a6);color:#fff;border:0;padding:12px 26px;border-radius:99px;font-weight:700;font-size:15px;letter-spacing:.06em;cursor:pointer;margin:6px}
.btn.alt{background:transparent;border:1px solid var(--cy);color:var(--cy)}
.card h3{margin:0 0 8px;color:var(--cy)}
.badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:99px;background:rgba(45,212,191,.16);border:1px solid rgba(45,212,191,.4);margin-left:8px;letter-spacing:.06em;vertical-align:middle}
.card p{line-height:1.55;margin:8px 0}
details{margin-top:10px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 14px}summary{cursor:pointer;color:var(--tl);font-weight:600}
.center{text-align:center}
.score{font-size:clamp(44px,10vw,76px);font-weight:800;color:var(--cy);text-shadow:0 0 24px rgba(34,211,238,.5)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}.stats div{padding:12px;border-radius:14px;background:rgba(255,255,255,.06)}.stats b{display:block;font-size:22px}
.rv{margin:10px 0;border-left:4px solid var(--ok)}.rv.bad{border-left-color:var(--no)}
.stamp{position:fixed;bottom:0;left:0;right:0;z-index:5;text-align:center;font-size:12px;letter-spacing:.12em;color:var(--mu);padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(5,13,31,.9))}
ul{line-height:1.8}.qt{text-align:center;font-size:clamp(16px,2.6vw,20px);line-height:1.5;margin:4px 0 6px}.clue{margin:8px auto;max-width:640px;padding:10px 14px;border-radius:12px;background:rgba(45,212,191,.1);border-left:4px solid var(--tl);animation:pop .4s}.btn:disabled{opacity:.5;cursor:default}
</style></head><body>

// ===== CLUE SYSTEM: question wording + 3 clues per question (Clinical -> Physiological -> Strong) =====
const CLUES={
1:["Adrenaline is producing its <b>cardiac effects</b>. Which receptor is primarily responsible?",["This receptor is strongly associated with the heart.","Activation increases heart rate and force of contraction.","Think of the β₁-adrenergic receptor found predominantly in cardiac tissue."]],
2:["Salbutamol is used to relieve <b>bronchospasm</b>. Which receptor does it activate?",["This receptor is associated with airway smooth muscle.","Activation causes relaxation of bronchial smooth muscle.","Think of the β₂-adrenergic receptor."]],
3:["Atropine reduces parasympathetic effects by blocking which receptor?",["The receptor normally responds to acetylcholine.","It is involved in salivation, smooth muscle activity and heart rate.","Think of the muscarinic cholinergic receptor."]],
4:["Pilocarpine produces parasympathetic-like effects. Which receptor does it activate?",["The receptor normally responds to acetylcholine.","Activation can increase glandular secretions.","Think of the muscarinic receptor."]],
5:["Nicotine acts on which type of cholinergic receptor?",["This receptor is involved in rapid neurotransmission.","Unlike muscarinic receptors, this receptor is a ligand-gated ion channel.","Its name begins with nicotinic."]],
6:["Morphine produces its <b>analgesic</b> effect by activating which receptor?",["This receptor is associated with opioid analgesia.","Activation reduces the perception and transmission of pain.","Think of the mu (μ) opioid receptor."]],
7:["Naloxone is used to reverse opioid effects. Which receptor does it block?",["It is used in opioid overdose.","It blocks the receptor responsible for many opioid effects, including respiratory depression.","Think of the μ-opioid receptor."]],
8:["Histamine contributes to <b>itching and allergic reactions</b>. Which receptor is primarily involved?",["This receptor is strongly associated with allergic symptoms.","Activation contributes to itching and increased vascular permeability.","Think of the H₁ receptor."]],
9:["Cetirizine reduces symptoms of <b>allergic rhinitis</b> by acting on which receptor?",["It is an antihistamine.","It reduces the effects of histamine responsible for itching and sneezing.","Think of the H₁ histamine receptor."]],
10:["Dopamine produces its effects by activating which type of receptor?",["This receptor responds to a major neurotransmitter in the CNS.","The neurotransmitter is involved in movement, motivation and reward.","Think of the dopamine receptor."]],
11:["Haloperidol produces its <b>antipsychotic</b> effect mainly by blocking which receptor?",["It is an antipsychotic drug.","It reduces excessive dopaminergic signalling.","Think specifically of the D₂ dopamine receptor."]],
12:["Serotonin produces its effects by acting on which receptor family?",["It is an important neurotransmitter.","It is involved in mood, gastrointestinal function and neurotransmission.","Think of the 5-HT receptor family."]],
13:["Ondansetron prevents <b>nausea and vomiting</b> by blocking which receptor?",["It is an antiemetic.","It blocks a serotonin receptor involved in the vomiting reflex.","Think of the 5-HT₃ receptor."]],
14:["GABA produces <b>inhibitory</b> effects in the CNS by acting on which receptor?",["GABA is the major inhibitory neurotransmitter in the brain.","One important GABA receptor is a ligand-gated ion channel.","Think of the GABA-A receptor."]],
15:["Diazepam enhances the action of GABA at which receptor?",["Diazepam is a benzodiazepine.","It enhances the effects of the brain's major inhibitory neurotransmitter.","Think of GABA acting at GABA-A receptors."]],
16:["Glutamate activates several receptors. Which receptor is an important <b>glutamate-gated ion channel</b>?",["Glutamate is a major excitatory neurotransmitter.","This receptor is important in neuronal communication and learning processes.","Think of the NMDA receptor."]],
17:["Insulin binds to which receptor to regulate <b>blood glucose</b>?",["Insulin helps lower blood glucose.","Its receptor is located on the cell surface and has enzyme activity.","Think of the insulin receptor, a receptor tyrosine kinase."]],
18:["Cortisol produces many of its effects by binding to which receptor?",["Cortisol is a steroid hormone.","Unlike many neurotransmitter receptors, its receptor is located inside the cell.","Think of the glucocorticoid receptor."]],
19:["Acetylcholine is producing a <b>parasympathetic effect that slows the heart</b>. Which receptor is involved?",["Think about the parasympathetic nervous system.","This receptor is found on many parasympathetic target organs.","Think of the muscarinic receptor."]],
20:["Adenosine can <b>slow cardiac activity</b> by acting on which receptor?",["This receptor is important in cardiac conduction.","Activation can slow the heart rate.","Think of the A₁ adenosine receptor."]]};
const OVERRIDE={
1:{receptor:"β₁-Adrenergic Receptor",effect:"Increased heart rate and force of contraction",explanation:"Adrenaline activates β₁-adrenergic receptors in the heart, increasing heart rate and contractility."},
9:{explanation:"Cetirizine blocks/inhibits H₁ receptor-mediated effects of histamine and is commonly used to relieve allergic symptoms."},
19:{receptor:"Muscarinic Receptor",distractors:["Nicotinic Receptor","α₁-Adrenergic Receptor","Dopamine D₂ Receptor"],receptorFamily:"GPCR",effect:"Slows heart rate (parasympathetic effect)",explanation:"Acetylcholine activates muscarinic receptors on parasympathetic target organs. In the heart, muscarinic activation can reduce heart rate.",extraKnowledge:"Acetylcholine also acts on nicotinic receptors, so questions must state the effect to pick the right subtype."}};

let S={i:0,res:[],score:0},salt=Math.random()*1e6|0;

const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

function recSVG(seed){const R=rng(seed),rot=(R()-.5)*60,fl=R()<.5?-1:1,h=185+R()*25|0;let g='';
 for(let i=0;i<7;i++){const x=40+i*20+(R()-.5)*5,y=62+(R()-.5)*10,hh=70+R()*14,t=(R()-.5)*14;g+=`<rect x="${x-7}" y="${y}" width="14" height="${hh}" rx="7" fill="hsla(${h},70%,45%,.55)" stroke="hsl(${h},80%,65%)" stroke-width="1.2" transform="rotate(${t} ${x} ${y+hh/2})"/>`}

 for(let i=0;i<2+(R()*2|0);i++){const x=35+R()*130;g+=`<path d="M${x} 134 q${(R()-.5)*30} 24 ${(R()-.5)*40} 14" stroke="hsl(${h},70%,60%)" fill="none" stroke-width="2"/>`}

function start(){S={i:0,res:[],score:0};salt=Math.random()*1e6|0;

 <div class="bar"><span class="pill">QUESTION ${String(i+1).padStart(2,'0')} / ${QUESTIONS.length}</span><span class="pill">Level: ${LV[q.difficulty]}</span><span class="pill" id="sc">Score: ${S.score} / ${MAX}</span></div>

 <div class="zone" id="zone"><div class="lig-wrap"><span class="lbl">LIGAND</span><div id="lig">⬡ ${q.drug.toUpperCase()}</div></div>
 <div class="recs">${opts.map((o,k)=>`<div class="rec" data-k="${k}">${recSVG(salt+q.id*97+k*13+o.length)}<div class="rn">RECEPTOR ${'ABCD'[k]}</div></div>`).join('')}</div>
 <div class="ana">Analysing receptor interaction...</div></div>
 <div id="msg"></div><div class="center"><button class="btn alt" id="clue">💡 SHOW CLUE 1 / 3 (−2 pts)</button></div><div id="clues"></div><div id="after"></div></div>`;
 const L=$('#lig'),msg=$('#msg'),zone=$('#zone');let sx,sy,drag=false;const cb=$('#clue');
 cb.onclick=()=>{if(lock||clue>=3)return;clue++;$('#clues').insertAdjacentHTML('beforeend',`<div class="clue">💡 <b>Clue ${clue} · ${['Clinical','Physiological','Strong'][clue-1]}:</b> ${q.clues[clue-1]}</div>`);cb.textContent=clue<3?`💡 SHOW CLUE ${clue+1} / 3 (−2 pts)`:'No more clues';cb.disabled=clue>=3};
 const hit=e=>{for(const el of document.elementsFromPoint(e.clientX,e.clientY)){const r=el.closest&&el.closest('.rec');if(r)return r}};
 const clr=()=>document.querySelectorAll('.rec').forEach(r=>r.classList.remove('hov'));
 const back=()=>{L.style.transition='transform .4s';L.style.transform='translate(0,0)';cur={x:0,y:0}};
 L.onpointerdown=e=>{if(lock)return;drag=true;sx=e.clientX-cur.x;sy=e.clientY-cur.y;L.setPointerCapture(e.pointerId);L.style.transition='none';L.classList.add('drag')};
 L.onpointermove=e=>{if(!drag)return;cur={x:e.clientX-sx,y:e.clientY-sy};L.style.transform=`translate(${cur.x}px,${cur.y}px)`;clr();const t=hit(e);if(t)t.classList.add('hov')};
 L.onpointercancel=()=>{drag=false;L.classList.remove('drag');clr();back()};
 L.onpointerup=e=>{if(!drag)return;drag=false;L.classList.remove('drag');const t=hit(e);clr();if(!t){back();return}drop(t)};
 function reveal(card,pts){cb.style.display='none';card.classList.add('win');card.querySelector('.rn').textContent=q.receptor;
  S.res[i]={id:q.id,attempts:att,clues:clue,pts,solved:pts>0};S.score+=pts;$('#sc').textContent=`Score: ${S.score} / ${MAX}`;
  msg.innerHTML=pts>0?`<div class="big ok">${q.receptor}</div><div class="ok" style="font-size:22px;margin-top:6px">✓ Correct!</div><div style="color:var(--cy);font-size:20px">+${pts} POINTS</div>`:`<div class="no">✕ Out of attempts — 0 points</div><div class="big">${q.receptor}</div><div class="hint">This was the correct receptor.</div>`;
  $('#after').innerHTML=`<div class="glass card" style="margin-top:12px"><h3>${q.receptor}<span class="badge">${q.receptorFamily}</span></h3><p><b>Drug:</b> ${q.drug}<br><b>Action:</b> ${q.action}<br><b>Main effect:</b> ${q.effect}</p><p>${q.explanation}</p><details><summary>Extra Knowledge (optional)</summary><p>${q.extraKnowledge}</p></details></div><div class="center"><button class="btn" id="nx">${i+1<QUESTIONS.length?'NEXT QUESTION ▶':'VIEW RESULTS ▶'}</button></div>`;
  $('#nx').onclick=()=>i+1<QUESTIONS.length?show(i+1):final();$('#nx').scrollIntoView({behavior:'smooth',block:'center'})}
 function drop(card){const k=+card.dataset.k;att++;
  if(opts[k]===q.receptor){lock=true;const p=card.querySelector('.pocket').getBoundingClientRect(),l=L.getBoundingClientRect();
   cur={x:cur.x+p.left+p.width/2-l.left-l.width/2,y:cur.y+p.top+p.height/2-l.top-l.height/2};
   L.style.transition='transform .5s';L.style.transform=`translate(${cur.x}px,${cur.y}px) scale(.65)`;L.classList.add('bound');
   msg.innerHTML='<div class="big ok">✓ BINDING SUCCESS</div>';
   setTimeout(()=>zone.classList.add('blur'),700);
   setTimeout(()=>{zone.classList.remove('blur');reveal(card,PTS[clue])},1800)}
  else{card.classList.add('shake');setTimeout(()=>card.classList.remove('shake'),500);back();
   if(att>=3){lock=true;const c=[...document.querySelectorAll('.rec')].find(r=>opts[+r.dataset.k]===q.receptor);reveal(c,0);return}
   msg.innerHTML=`<div class="no">✕ NOT QUITE!</div><div class="hint">💡 Rethink the drug → effect → receptor link, or reveal a clue.</div><div class="hint">Attempts left: ${3-att}</div>`}}
}
function rating(s){return s>=180?['🟢','EXCELLENT']:s>=150?['🔵','VERY GOOD']:s>=120?['🟡','GOOD']:s>=80?['🟠','NEEDS IMPROVEMENT']:['🔴','REVIEW RECOMMENDED']}
function final(){const r=S.res,sol=r.filter(x=>x.solved),n=a=>sol.filter(x=>x.attempts===a).length,[ic,lb]=rating(S.score);
 const miss=r.filter(x=>x.attempts>1||!x.solved||x.clues>0).map(x=>QUESTIONS.find(q=>q.id===x.id));
 const topics=[...new Set(miss.map(q=>q.topic))],fams=[...new Set(miss.filter(q=>/Ligand/.test(q.receptorFamily)).map(()=> 'Ligand-gated ion channels'))];
 app.innerHTML=`<div class="glass center"><h1>DRUG–RECEPTOR CHALLENGE COMPLETE</h1><p class="lbl" style="margin-top:20px">YOUR SCORE</p><div class="score">${S.score} / ${MAX}</div><h2>${Math.round(S.score/MAX*100)}%</h2><h2>${ic} ${lb}</h2>
 <div class="stats"><div><b>${sol.length} / ${QUESTIONS.length}</b>Correct Answers</div><div><b>${sol.filter(x=>!x.clues).length}</b>No Clue</div><div><b>${sol.filter(x=>x.clues===1).length}</b>After Clue 1</div><div><b>${sol.filter(x=>x.clues===2).length}</b>After Clue 2</div><div><b>${sol.filter(x=>x.clues===3).length}</b>After Clue 3</div></div>
 <div style="text-align:left;max-width:520px;margin:auto"><h3 style="color:var(--cy)">Topics to Review</h3>${[...topics,...fams].length?`<p>You may want to review:</p><ul>${[...topics,...fams].map(t=>`<li>${t}</li>`).join('')}</ul>`:'<p class="ok">Outstanding — no weak areas detected!</p>'}</div>
 <button class="btn" id="rv">REVIEW ANSWERS</button><button class="btn alt" id="rt">RETRY QUIZ</button></div>`;
 $('#rv').onclick=()=>review(false);$('#rt').onclick=start}
function review(only){const list=QUESTIONS.filter(q=>{const x=S.res.find(r=>r.id===q.id);return!only||(x&&(!x.solved||x.attempts>1||x.clues>0))});
 app.innerHTML=`<h1>REVIEW ANSWERS</h1><div class="center" style="margin:14px 0"><button class="btn${only?' alt':''}" id="a">ALL QUESTIONS</button><button class="btn${only?'':' alt'}" id="w">MISSED ONLY</button><button class="btn alt" id="b">◀ RESULTS</button></div>
 ${list.length?list.map(q=>{const x=S.res.find(r=>r.id===q.id)||{},bad=!x.solved||x.attempts>1||x.clues>0;return`<div class="glass card rv ${bad?'bad':''}"><h3>Q${q.id}. ${q.drug}<span class="badge">${x.solved?`${x.pts} pts · ${x.clues} clue${x.clues==1?'':'s'}`:'0 pts'}</span></h3><p><b>Correct receptor:</b> ${q.receptor}<br><b>Action:</b> ${q.action}<br><b>Main effect:</b> ${q.effect}</p><p><b>Explanation:</b> ${q.explanation}</p></div>`}).join(''):'<p class="center ok">Nothing missed — perfect run!</p>'}
 <div class="center"><button class="btn" id="rt">RETRY QUIZ</button></div>`;
 $('#a').onclick=()=>review(false);$('#w').onclick=()=>review(true);$('#b').onclick=final;$('#rt').onclick=start;scrollTo(0,0)}
// particles
(function(){const c=$('#cv'),x=c.getContext('2d');let w,h,P=[];const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight};rs();addEventListener('resize',rs);
 for(let i=0;i<40;i++)P.push({x:Math.random()*w,y:Math.random()*h,r:1+Math.random()*3,vx:(Math.random()-.5)*.3,vy:-.1-Math.random()*.3});
 (function f(){x.clearRect(0,0,w,h);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.y<-5){p.y=h+5;p.x=Math.random()*w}x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle='rgba(34,211,238,.35)';x.shadowColor='#22d3ee';x.shadowBlur=10;x.fill()});requestAnimationFrame(f)})()})();
start();
