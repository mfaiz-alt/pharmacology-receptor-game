<html lang="en">
<head>

<title>Drug–Receptor Binding Challenge | UiTM PH110</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1828;--panel:#15263b;--line:#2b4363;--tx:#e8eef6;--mu:#8fa5c0;--cy:#4fd1c5;--am:#f6c453;--rd:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 40%,#16304a,var(--bg) 70%);color:var(--tx);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{text-align:center;padding:18px 12px 4px}
h1{margin:0;font-size:clamp(1.2rem,3vw,1.9rem);letter-spacing:.04em}
.sub{color:var(--mu);font-size:.85rem}
.bar{display:flex;justify-content:space-between;align-items:center;max-width:1100px;width:100%;margin:8px auto;padding:0 16px;font-weight:500}
.prog{height:4px;background:var(--line);max-width:1068px;width:calc(100% - 32px);margin:0 auto;border-radius:2px}
.prog i{display:block;height:100%;background:var(--cy);border-radius:2px;transition:width .4s}
main{flex:1;max-width:1100px;width:100%;margin:0 auto;padding:12px 16px}
.q{text-align:center;font-size:1.1rem;margin:10px 0 14px}
.arena{display:grid;grid-template-columns:1fr 190px 1fr;gap:14px;align-items:center}
.col{display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;transition:.25s;position:relative}
.card.over{border-color:var(--cy);box-shadow:0 0 0 2px var(--cy)}
.card.out{opacity:.35}
.card h3{margin:0 0 4px;font-size:.95rem;color:var(--cy)}
.card dl{margin:0;font-size:.82rem}.card dt{color:var(--mu);font-size:.72rem;margin-top:4px}.card dd{margin:0}
.rec{width:100%;height:84px;display:block}
.bind{width:100%;margin-top:6px;background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:5px;font:inherit;font-size:.78rem;cursor:pointer}
.bind:hover,.bind:focus-visible{border-color:var(--cy);outline:none}
.lig{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.drug{touch-action:none;cursor:grab;user-select:none;background:#1c3a57;border:2px solid var(--am);border-radius:50%;width:132px;height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;position:relative;transition:transform .35s}
.drug.drag{transition:none;cursor:grabbing;box-shadow:0 0 24px #f6c45366}
.drug b{font-size:.95rem;padding:0 6px}.drug small{color:var(--mu);font-size:.65rem}
.lbl{color:var(--mu);font-size:.75rem}.use{font-size:.8rem;color:var(--mu)}
.btns{display:flex;gap:8px;justify-content:center;margin:14px 0;flex-wrap:wrap}
button.b{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.b:hover:not(:disabled),button.b:focus-visible{border-color:var(--am);outline:none}
button.b:disabled{opacity:.4;cursor:default}button.p{background:var(--cy);color:#06241f;border-color:var(--cy);font-weight:700}
.hints{max-width:700px;margin:0 auto;font-size:.9rem}.hints p{margin:6px 0;padding:8px 12px;border-left:3px solid var(--am);background:#f6c4531a;border-radius:0 8px 8px 0}
.msg{text-align:center;min-height:30px;font-weight:700;font-size:1.05rem}
.bad{color:var(--rd)}.good{color:var(--cy)}
.blur .rec,.blur .drug{filter:blur(6px)}
.reveal{text-align:center;margin:8px 0}.reveal h2{margin:0;font-size:clamp(1.3rem,4vw,2rem);color:var(--am)}
.xp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;max-width:700px;margin:10px auto}
.xp h3{margin:0 0 6px;color:var(--cy)}.xp p{margin:6px 0}.xp summary{cursor:pointer;color:var(--am)}
.end{text-align:center;padding:30px 0}.end .big{font-size:3rem;color:var(--am);font-weight:700}
footer{text-align:center;padding:14px;color:var(--mu);font-size:.8rem;border-top:1px solid var(--line)}
footer b{color:var(--tx)}
@media(max-width:760px){.arena{grid-template-columns:1fr 1fr}.lig{grid-column:1/-1;order:-1}.col{display:contents}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.music-btn{position:fixed;top:12px;right:12px;z-index:1000;background:rgba(21,38,59,.92);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font:600 12px 'Space Grotesk',system-ui,sans-serif;cursor:pointer;backdrop-filter:blur(8px);box-shadow:0 4px 18px rgba(0,0,0,.25)}
.music-btn:hover{border-color:var(--cy);color:var(--cy)}
.music-btn.off{color:var(--mu)}
@media(max-width:600px){.music-btn{top:8px;right:8px;padding:7px 10px;font-size:11px}}
</style>

["Adrenaline","Emergency drug that stimulates the heart","β₁-Adrenergic Receptor","Agonist","GPCR","Increased heart rate and contractility","HRT",["AIR","CNS","GLD"],["Used in cardiac arrest to restart and strengthen the heartbeat.","This receptor is found in the pacemaker and muscle of the heart.","Its activation increases heart rate and force of contraction."],"Adrenaline activates β₁-adrenergic receptors in the heart, increasing heart rate and contractility.","β₁ receptors couple to Gs, raising cAMP and calcium entry in cardiac cells."],

// ===== ORIGINAL PROCEDURAL BACKGROUND MUSIC =====
// The soundtrack is generated in the browser with Web Audio API.
// No external audio file is used, so there is no music licensing/copyright file to upload.
let musicOn=true, audioCtx=null, masterGain=null, musicTimer=null, musicStep=0;

function initMusic(){
  if(audioCtx)return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  audioCtx=new AC();
  masterGain=audioCtx.createGain();
  masterGain.gain.value=0.12; // subtle classroom-friendly volume
  masterGain.connect(audioCtx.destination);
}

function note(freq,dur=.9,delay=0){
  if(!audioCtx||!musicOn)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sine';
  o.frequency.value=freq;
  const now=audioCtx.currentTime+delay;
  g.gain.setValueAtTime(0,now);
  g.gain.linearRampToValueAtTime(.12,now+.08);
  g.gain.exponentialRampToValueAtTime(.001,now+dur);
  o.connect(g);g.connect(masterGain);
  o.start(now);o.stop(now+dur+.05);
}

function playAmbientBar(){
  if(!audioCtx||!musicOn)return;
  // Slow original ambient progression: Am → F → C → G
  const chords=[
    [220,261.63,329.63],
    [174.61,220,261.63],
    [261.63,329.63,392],
    [196,246.94,293.66]
  ];
  const c=chords[musicStep%chords.length];
  c.forEach((f,j)=>note(f,3.2,j*.06));
  note(c[1]*2,1.5,.45);
  note(c[2]*2,1.5,1.65);
  musicStep++;
}

function startMusic(){
  if(!musicOn)return;
  initMusic();
  if(!audioCtx)return;
  if(audioCtx.state==='suspended')audioCtx.resume();
  if(musicTimer===null){
    playAmbientBar();
    musicTimer=setInterval(playAmbientBar,3200);
  }
}

function stopMusic(){
  musicOn=false;
  if(musicTimer!==null){clearInterval(musicTimer);musicTimer=null}
  if(masterGain&&audioCtx){
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setTargetAtTime(0,audioCtx.currentTime,.05);
  }
}

function toggleMusic(){
  if(musicOn){
    stopMusic();
  }else{
    musicOn=true;
    if(masterGain)masterGain.gain.setTargetAtTime(.045,audioCtx.currentTime,.08);
    startMusic();
  }
  updateMusicButton();
}

function updateMusicButton(){
  const b=$('#musicBtn');
  b.textContent=musicOn?'🎵 Music ON':'🔇 Music OFF';
  b.classList.toggle('off',!musicOn);
}

$('#musicBtn').onclick=toggleMusic;
updateMusicButton();

let i=0,score=0,hints=0,tries=0,done=false,order=[],hist=[];
const fp=x=>typeof x==="string"?P[x]:x;
const shuf=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a};
function rec(seed){let s=seed*9301+49297,r=()=>(s=(s*9301+49297)%233280)/233280,o='',rot=r()*50-25;
 for(let k=0;k<6;k++){const x=22+k*28+r()*6,t=r()*14-7;o+=`<rect x="${x}" y="${8+r()*5}" width="14" height="${60+r()*8}" rx="7" fill="#2d6a8a" opacity=".85" transform="rotate(${t} ${x+7} 42)"/>`}
 const px=70+r()*40,pw=30+r()*6;
 return `<svg class="rec" viewBox="0 0 200 84" aria-hidden="true"><g transform="rotate(${rot} 100 42)">${o}<path d="M${px} 8 q${pw/2} ${34+r()*4} ${pw} 0 q-${pw/2} -6 -${pw} 0z" fill="#0d1828" stroke="#4fd1c5" stroke-width="1.4"/><circle cx="${px+pw/2}" cy="${30+r()*6}" r="${2+r()*2}" fill="#4fd1c5" opacity=".6"/></g></svg>`}
function load(){const q=Q[i];done=false;hints=0;tries=0;
 order=shuf([{c:1,f:fp(q[6])},...q[7].map(k=>({c:0,f:fp(k)}))]);
 const L='ABCD';const card=(o,n)=>`<div class="card" id="t${n}" data-n="${n}">${rec(i*7+n+1)}<h3>TARGET ${L[n]}</h3><dl><dt>Primary location</dt><dd>${o.f[0]}</dd><dt>Main effect</dt><dd>${o.f[1]}</dd><dt>Receptor family</dt><dd>${o.f[2]}</dd></dl><button class="bind" data-n="${n}">Bind here</button></div>`;
 $('#qn').textContent=`QUESTION ${String(i+1).padStart(2,'0')} / ${Q.length}`;$('#sc').textContent=`Score: ${score}`;$('#pg').style.width=(i/Q.length*100)+'%';
 app.innerHTML=`<div class="q">Which receptor mediates the main therapeutic effect of this drug?</div>
 <div class="arena" id="arena"><div class="col">${card(order[0],0)}${card(order[2],2)}</div>
 <div class="lig"><span class="lbl">LIGAND</span><div class="drug" id="drug" tabindex="0" aria-label="Drag ${q[0]} onto a target, or use the Bind buttons"><b>${q[0].toUpperCase()}</b><small>drag to a target</small></div><div class="use">${q[1]}</div></div>
 <div class="col">${card(order[1],1)}${card(order[3],3)}</div></div>
 <div class="msg" id="msg"></div><div class="btns" id="btns"><button class="b" id="hb">Hint 1 (max +8)</button></div><div class="hints" id="hints"></div><div id="after"></div>`;
 $('#hb').onclick=hint;document.querySelectorAll('.bind').forEach(b=>b.onclick=()=>attempt(+b.dataset.n));drag();startMusic()}
function hint(){if(done||hints>=3)return;const q=Q[i];hints++;$('#hints').insertAdjacentHTML('beforeend',`<p><b>Hint ${hints}:</b> ${q[8][hints-1]}</p>`);
 const b=$('#hb');if(hints>=3){b.disabled=true;b.textContent='No more hints'}else b.textContent=`Hint ${hints+1} (max +${10-2*(hints+1)})`}
function drag(){const d=$('#drug');let sx,sy,on=0;
 d.onpointerdown=e=>{if(done)return;on=1;sx=e.clientX;sy=e.clientY;d.setPointerCapture(e.pointerId);d.classList.add('drag')};
 d.onpointermove=e=>{if(!on)return;d.style.transform=`translate(${e.clientX-sx}px,${e.clientY-sy}px)`;const t=at(e);document.querySelectorAll('.card').forEach(c=>c.classList.toggle('over',c===t))};
 d.onpointerup=e=>{if(!on)return;on=0;d.classList.remove('drag');const t=at(e);document.querySelectorAll('.card').forEach(c=>c.classList.remove('over'));d.style.transform='';if(t&&!t.classList.contains('out'))attempt(+t.dataset.n)};
 d.onkeydown=e=>{if(e.key==='h')hint()}}
function at(e){return [...document.querySelectorAll('.card')].find(c=>{const r=c.getBoundingClientRect();return e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom})}
function attempt(n){if(done)return;const t=$('#t'+n);if(t.classList.contains('out'))return;
 if(order[n].c)return win(n);
 tries++;t.classList.add('out');const m=$('#msg');m.className='msg bad';
 if(tries>=3){m.textContent='';return lose()}
 m.textContent=`✕ NOT THIS TARGET (attempt ${tries} of 3)`;$('#drug').style.transform=''}
function reveal(n,pts,ok){done=true;const q=Q[i],t=$('#t'+n),d=$('#drug');
 document.querySelectorAll('.bind').forEach(b=>b.disabled=true);$('#btns').innerHTML='';
 const a=$('#arena');
 if(ok){const rt=t.querySelector('.rec').getBoundingClientRect(),dr=d.getBoundingClientRect();d.style.transform=`translate(${rt.left+rt.width/2-dr.left-dr.width/2}px,${rt.top+rt.height/2-dr.top-dr.height/2}px) scale(.6)`;
  $('#msg').className='msg good';$('#msg').textContent='✓ BINDING SUCCESS'}
 else{$('#msg').className='msg bad';$('#msg').textContent='TARGET IDENTIFIED';t.classList.remove('out');t.classList.add('over')}
 setTimeout(()=>{a.classList.add('blur');$('#msg').className='msg';$('#msg').textContent='Analysing receptor interaction...';
  setTimeout(()=>{a.classList.remove('blur');score+=pts;hist.push(pts);$('#sc').textContent=`Score: ${score}`;
   $('#msg').innerHTML='';
   $('#after').innerHTML=`<div class="reveal"><h2>${q[2]}</h2><div class="${pts?'good':'bad'}" style="font-weight:700">${ok?'✓ CORRECT':'✕ MISSED'} &nbsp; +${pts} POINTS</div></div>
   <div class="xp"><h3>${q[2]}</h3><p><b>Drug:</b> ${q[0]}<br><b>Action:</b> ${q[3]}<br><b>Receptor family:</b> ${q[4]}<br><b>Main effect:</b> ${q[5]}</p><p><b>Why?</b> ${q[9]}</p><details><summary>Extra Knowledge</summary><p>${q[10]}</p></details></div>
   <div class="btns"><button class="b p" id="nx">${i+1<Q.length?'Next question':'See results'}</button></div>`;
   $('#nx').onclick=()=>{i++;i<Q.length?load():finish()};$('#nx').focus()},1100)},ok?900:500)}
function win(n){reveal(n,[10,8,6,4][hints],true)}
function lose(){reveal(order.findIndex(o=>o.c),0,false)}
function finish(){stopMusic();$('#pg').style.width='100%';const mx=Q.length*10,p=Math.round(score/mx*100);
 app.innerHTML=`<div class="end"><div class="lbl">FINAL SCORE</div><div class="big">${score} / ${mx}</div><p>${p}% &mdash; ${p>=80?'Excellent receptor reasoning.':p>=50?'Good progress. Review the explanations and try again.':'Keep practising: link each drug to its tissue and effect.'}</p><button class="b p" id="rs">Play again</button></div>`;
 $('#rs').onclick=()=>{i=0;score=0;hist=[];load()}}
load();
</script>
